<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocolime.cl - Muy Pronto</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }
        .logo-placeholder {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            color: #adff2f; /* Color Verde Lima */
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #ffffff;
        }
        p {
            font-size: 0.95rem;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .social-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }
        .btn-tiktok {
            background-color: #000000;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-tiktok span {
            color: #25F4EE; /* Efecto glitch cian de tiktok */
            text-shadow: -1px -1px 0 #FE2C55, 1px 1px 0 #25F4EE;
        }
        .footer {
            margin-top: 35px;
            font-size: 0.8rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-placeholder">cocolime.cl</div>
        <h1>Estamos cocinando algo increíble</h1>
        <p>Mientras preparamos nuestra web, no te pierdas nada de lo que viene. ¡Síguenos en nuestras redes oficiales!</p>
        
        <div class="social-box">
            <!-- REEMPLAZA EL '#' ENTRE LAS COMILLAS POR TU LINK REAL DE INSTAGRAM -->
            <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
                📸 Síguenos en Instagram
            </a>
            
            <!-- REEMPLAZA EL '#' ENTRE LAS COMILLAS POR TU LINK REAL DE TIKTOK -->
            <a href="https://tiktok.com" target="_blank" class="btn btn-tiktok">
                🎵 Ver adelantos en <span>TikTok</span>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 cocolime.cl. Todos los derechos reservados.
        </div>
    </div>

</body>
</html>
